# EvanProxy Configuration
[proxy]
local_ip=127.0.0.1
http_port=443
enet_port=17091
manage_hosts=true

[upstream]
server_data_hosts=www.growtopia1.com,www.growtopia2.com
dns_server=1.1.1.1
verify_upstream_tls=false
using_new_packet=true

[log]
log_text_packets=true
log_variants=true
log_game_packets=false
log_to_file=true
log_hex=false
log_actions=true
log_raw_movement=false

[features]
ui_theme=classic
fast_drop=false
fast_trash=false
unlimited_zoom=true
hide_clothes=false
formalize_chat=false
style_all_dialogs=false
auto_bgl=true
gems_tracker=true
hotkeys_enabled=true
fast_buy=0
fast_buy_qty=1
vending_info=true
title_maxlevel=false
title_doctor=true
title_legendary=true
title_g4g=false
title_master=false
title_mentor=false
title_growroyal_tier=0
title_royalwinter=false
title_thanksgiving=false
title_anniversary=false
title_award=false
title_party=false
title_cc_badge=false
title_tt_badge=true
