title_immortal=false
title_moderator=true
title_developer=false
fps_show_name=true
fps_boost=true
fps_hide_bubbles=false
evan_branding=true
outgoing_evan_prefix=false
rainbow_name=false
custom_banner=true
hud_overlay=false
zoom_percent=200
weather_override=true
weather_id=55

[hotkeys]
